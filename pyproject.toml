[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marketsignal"
version = "0.1.0"
description = "Anticipation des crises de marché pour les entreprises : indicateurs d'alerte précoce, score de risque et modèle prédictif."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
marketsignal = "marketsignal.cli:main"

[tool.setuptools.packages.find]
include = ["marketsignal*"]

[tool.setuptools.package-data]
marketsignal = ["dashboard.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
